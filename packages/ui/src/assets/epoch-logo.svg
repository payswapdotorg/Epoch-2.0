<svg width="18" height="18" viewBox="0 0 18 18" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    Epoch 产品 logo（W036）——桌面标题栏/侧栏折叠态使用的应用瓦片。
    与 build/epoch-artwork/epoch-icon.svg、renderer/index.html 启动标记同一制图母题：
    蓝图海军蓝圆角图板 + 制图纸色 I 字钢截面 "E"，中肢为陶土色测量臂。
    18px 视口下省略图纸边框（该尺寸下不可辨认）。
  -->
  <defs>
    <linearGradient id="epochLogoPlate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24466E" />
      <stop offset="1" stop-color="#1F3A5F" />
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="18" height="18" rx="3.94" fill="url(#epochLogoPlate)" />
  <rect x="4.96" y="3.555" width="2.461" height="10.887" fill="#F5F1EA" />
  <rect x="4.96" y="3.555" width="8.086" height="2.461" fill="#F5F1EA" />
  <rect x="4.96" y="7.764" width="7.168" height="2.461" fill="#C75D3F" />
  <rect x="4.96" y="11.974" width="8.086" height="2.461" fill="#F5F1EA" />
</svg>
