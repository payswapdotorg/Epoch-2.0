# W036: Epoch Ubuntu 桌面发布工作流。
#
# 两条受控路径（spec/work-orders/W036-ubuntu-epoch-desktop-release.md 的 Release workflow 节）：
#   1. 手动候选构建（workflow_dispatch，默认）——构建 + 全套验收门，产物以 workflow
#      artifact 上传供审阅，绝不自动发布。
#   2. 版本化发布（push tag epoch-vX.Y.Z）——同一候选管线全绿后，才创建公开
#      GitHub Release 并挂载 .deb / .AppImage / SHA256SUMS / release-manifest.json /
#      验收摘要；发布后回读每个资产 URL 校验 size 与 checksum。
#
# 设计法：
#   - 最小权限：candidate 作业只读 contents；publish 作业才拿 contents:write，
#     且只在 tag 上运行（manual 调用永远到不了 publish）。
#   - 冻结依赖：pnpm install --frozen-lockfile（packageManager 锁定 pnpm 10.33.2，Node 24）。
#   - 不发明命令：构建/校验/验收全部走仓库真实脚本（scripts/linux-release/* 与
#     qa/epoch-ubuntu-release/*，同一条发布门在本地与 CI 完全一致）。
#   - 无密钥入库；日志不含 secret。低内存防线（本地 4GB 盒实测的 OOM 类）：
#     串行 tsup/vite、关闭 renderer sourcemap、turbo 单并发——大 runner 同样安全。
#   - Actions 用官方仓 major-pin；发布用 runner 预装 gh（不引入第三方 release action）。
#
# W038: arm64 矩阵腿（TL 集成面）。设计法：
#   - candidate-arm64 与 x64 candidate 完全对称（同一构建/演练/验收门，仅
#     --arch arm64 + ubuntu-24.04-arm 托管 runner + arm64 产物名 + 证据写
#     evidence/arm64/ 子目录，不覆盖 x86_64 证据）。x64 candidate 作业逐字节
#     不变（非协商法 1：x86_64 冻结）。
#   - 产物命名依据 electron-builder@26.8.1 源码 getArtifactArchName（非猜测）：
#     deb=arm64（Debian 架构名），AppImage=arm64（aarch64 重映射只适用于
#     pacman/rpm/flatpak；x64 的 x86_64 是 x64 专属特例）——与验收规格
#     spec/acceptance/ubuntu-arm64-release.md 的名称一致。
#   - publish needs 两个 candidate（法 4 fail-closed：arm64 门失败阻塞整个 tag
#     发布，绝不静默降级为「仅 x86_64」；法 7：x86_64 节奏不被 arm64 绑架——
#     由 TL 决定何时打 tag）。
#   - 双架构 SHA256SUMS：各自目录内先严格校验，再合并为一份发布 SUMS（两架构
#     产物文件名不相交，逐行合并无损）。arm64 的 manifest/summary/report 以
#     -arm64 后缀发布（对溯源数据零手术）。
#   - 更新 feed 合并：两个单架构 latest-linux.yml 合并为一份双架构 feed，x64
#     条目在前。依据 electron-updater@6.8.3 findFile 源码语义（非猜测）：按扩展
#     名过滤后，优先 URL 含 process.arch 子串的条目（arm64 客户端命中
#     linux-arm64.*）；x64 客户端在 "x86_64" 文件名中匹配不到 "x64" 子串，回退
#     取首个同扩展名条目——x64 在前保证两个架构都解析到正确产物。合并步骤
#     fail-closed（版本一致、每 feed 恰 2 条、4 个唯一 url、重解析断言）。
name: Epoch Ubuntu Release

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes (markdown, tag builds only; candidate builds ignore this)"
        required: false
        default: ""
  push:
    tags:
      - "epoch-v*"

permissions: {}

concurrency:
  group: epoch-ubuntu-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  candidate:
    name: Build + acceptance gate (no publish)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      ZCODE_DESKTOP_SERIAL_BUILD: "1"
      ZCODE_DESKTOP_RENDERER_SOURCEMAP: "0"
      TURBO_CONCURRENCY: "1"
    steps:
      - name: Checkout (full history for release manifest provenance)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm 10.33.2 (must precede setup-node — the action resolves packageManager and invokes pnpm)
        run: |
          npm install -g pnpm@10.33.2
          pnpm --version

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"

      - name: Install desktop runtime libraries + Xvfb (real-window journey)
        run: |
          sudo apt-get update
          # ubuntu-24.04 的 t64 过渡：libasound2 已更名 libasound2t64（transitional 包不在源里）。
          sudo apt-get install -y --no-install-recommends \
            xvfb libgbm1 libasound2t64 libgtk-3-0 libnss3 libxss1 libxtst6 \
            libatspi2.0-0 libsecret-1-0 libnotify4 xdg-utils

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Build Epoch linux x64 artifacts (deb + AppImage, locked identity)
        run: bash packages/desktop/scripts/linux-release/build-linux-release.sh

      - name: Install/launch drill (non-root)
        run: bash packages/desktop/scripts/linux-release/install-launch-check.sh

      - name: Acceptance gate (brand audit + real Electron window journey + aggregate)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          bash qa/epoch-ubuntu-release/run-release-gate.sh \
            --deb "packages/desktop/dist/Epoch-${VERSION}-linux-amd64.deb" \
            --appimage "packages/desktop/dist/Epoch-${VERSION}-linux-x86_64.AppImage"

      - name: Upload candidate artifacts (always — review even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epoch-ubuntu-x64-candidate
          path: |
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/SHA256SUMS
            packages/desktop/dist/release-manifest.json
            packages/desktop/dist/validation-report.json
            packages/desktop/dist/latest-linux.yml
            packages/desktop/dist/*.blockmap
            qa/epoch-ubuntu-release/evidence/
          if-no-files-found: warn
          retention-days: 14

  candidate-arm64:
    name: Build + acceptance gate, arm64 (no publish)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    timeout-minutes: 90
    env:
      ZCODE_DESKTOP_SERIAL_BUILD: "1"
      ZCODE_DESKTOP_RENDERER_SOURCEMAP: "0"
      TURBO_CONCURRENCY: "1"
    steps:
      - name: Checkout (full history for release manifest provenance)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup pnpm 10.33.2 (must precede setup-node — the action resolves packageManager and invokes pnpm)
        run: |
          npm install -g pnpm@10.33.2
          pnpm --version

      - name: Setup Node 24
        uses: actions/setup-node@v5
        with:
          node-version: "24.21.0"

      - name: Install desktop runtime libraries + Xvfb (real-window journey)
        run: |
          sudo apt-get update
          # ubuntu-24.04 的 t64 过渡：libasound2 已更名 libasound2t64（transitional 包不在源里）。
          sudo apt-get install -y --no-install-recommends \
            xvfb libgbm1 libasound2t64 libgtk-3-0 libnss3 libxss1 libxtst6 \
            libatspi2.0-0 libsecret-1-0 libnotify4 xdg-utils

      - name: Frozen dependency install
        run: pnpm install --frozen-lockfile

      - name: Build Epoch linux arm64 artifacts (deb + AppImage, locked identity)
        run: bash packages/desktop/scripts/linux-release/build-linux-release.sh --arch arm64

      - name: Install/launch drill (non-root)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          bash packages/desktop/scripts/linux-release/install-launch-check.sh \
            --deb "packages/desktop/dist/Epoch-${VERSION}-linux-arm64.deb" \
            --appimage "packages/desktop/dist/Epoch-${VERSION}-linux-arm64.AppImage"

      - name: Acceptance gate (brand audit + real Electron window journey + aggregate)
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          # 证据写 arm64 子目录（工作单法：不覆盖 x86_64 证据）。
          EPOCH_EVIDENCE_DIR="$PWD/qa/epoch-ubuntu-release/evidence/arm64" \
            bash qa/epoch-ubuntu-release/run-release-gate.sh \
            --deb "packages/desktop/dist/Epoch-${VERSION}-linux-arm64.deb" \
            --appimage "packages/desktop/dist/Epoch-${VERSION}-linux-arm64.AppImage"

      - name: Upload candidate artifacts (always — review even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: epoch-ubuntu-arm64-candidate
          path: |
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/SHA256SUMS
            packages/desktop/dist/release-manifest.json
            packages/desktop/dist/validation-report.json
            packages/desktop/dist/latest-linux.yml
            packages/desktop/dist/*.blockmap
            qa/epoch-ubuntu-release/evidence/arm64/
          if-no-files-found: warn
          retention-days: 14

  publish:
    name: Publish GitHub Release (tag only, after gates)
    needs: [candidate, candidate-arm64]
    if: startsWith(github.ref, 'refs/tags/epoch-v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 20
    steps:
      - name: Download x64 candidate artifacts
        uses: actions/download-artifact@v5
        with:
          name: epoch-ubuntu-x64-candidate
          path: candidate-x64

      - name: Download arm64 candidate artifacts
        uses: actions/download-artifact@v5
        with:
          name: epoch-ubuntu-arm64-candidate
          path: candidate-arm64

      - name: Locate artifacts + verify SHA256SUMS integrity + merge update feed
        run: |
          set -euo pipefail
          DEB="$(find candidate-x64 -name 'Epoch-*-linux-amd64.deb' | head -1)"
          APPIMAGE="$(find candidate-x64 -name 'Epoch-*-linux-x86_64.AppImage' | head -1)"
          DEB_ARM="$(find candidate-arm64 -name 'Epoch-*-linux-arm64.deb' | head -1)"
          APPIMAGE_ARM="$(find candidate-arm64 -name 'Epoch-*-linux-arm64.AppImage' | head -1)"
          SUMS_X64="$(find candidate-x64 -name SHA256SUMS | head -1)"
          SUMS_ARM="$(find candidate-arm64 -name SHA256SUMS | head -1)"
          MANIFEST="$(find candidate-x64 -name release-manifest.json | head -1)"
          SUMMARY="$(find candidate-x64 -name acceptance-summary.md | head -1)"
          REPORT="$(find candidate-x64 -name acceptance-report.json | head -1)"
          test -n "$DEB" && test -n "$APPIMAGE" && test -n "$DEB_ARM" && test -n "$APPIMAGE_ARM"
          test -n "$SUMS_X64" && test -n "$SUMS_ARM" && test -n "$MANIFEST" && test -n "$SUMMARY" && test -n "$REPORT"
          # 每架构先在各自目录内严格校验（合并前各自成立，目录不混淆）。
          (cd "$(dirname "$SUMS_X64")" && sha256sum --check --strict "$(basename "$SUMS_X64")")
          (cd "$(dirname "$SUMS_ARM")" && sha256sum --check --strict "$(basename "$SUMS_ARM")")
          # W038 双架构合并 SHA256SUMS：产物文件名不相交，逐行合并无损，发布单一 SUMS。
          cat "$SUMS_X64" "$SUMS_ARM" | sort -u > "$RUNNER_TEMP/SHA256SUMS"
          SUMS="$RUNNER_TEMP/SHA256SUMS"
          # arm64 侧 manifest/summary/report 以 -arm64 后缀发布（对溯源数据零手术）。
          MANIFEST_ARM="$RUNNER_TEMP/release-manifest-arm64.json"
          SUMMARY_ARM="$RUNNER_TEMP/acceptance-summary-arm64.md"
          REPORT_ARM="$RUNNER_TEMP/acceptance-report-arm64.json"
          cp "$(find candidate-arm64 -name release-manifest.json | head -1)" "$MANIFEST_ARM"
          cp "$(find candidate-arm64 -name acceptance-summary.md | head -1)" "$SUMMARY_ARM"
          cp "$(find candidate-arm64 -name acceptance-report.json | head -1)" "$REPORT_ARM"
          # W037/W038 更新 feed：两个单架构 latest-linux.yml 合并为一份双架构 feed。
          # x64 条目在前（electron-updater@6.8.3 findFile 源码语义：按扩展名过滤后
          # 优先 URL 含 process.arch 子串的条目；x64 客户端在 "x86_64" 中匹配不到
          # "x64" 子串回退取首个同扩展名条目——x64 在前保证两架构都解析正确）。
          # 合并 fail-closed：版本一致、每 feed 恰 2 条、4 个唯一 url、重解析断言。
          LATEST_X64="$(find candidate-x64 -name latest-linux.yml | head -1 || true)"
          LATEST_ARM="$(find candidate-arm64 -name latest-linux.yml | head -1 || true)"
          LATESTYML=""
          if [ -n "$LATEST_X64" ] && [ -n "$LATEST_ARM" ]; then
            LATESTYML="$RUNNER_TEMP/latest-linux.yml"
            python3 -c '
          import sys, yaml
          x = yaml.safe_load(open(sys.argv[1])); a = yaml.safe_load(open(sys.argv[2]))
          assert x["version"] == a["version"], "feed version mismatch: %s vs %s" % (x["version"], a["version"])
          for feed, tag in ((x, "x64"), (a, "arm64")):
              files = feed["files"]
              assert len(files) == 2, "%s feed must carry exactly 2 file entries (deb+AppImage), got %d" % (tag, len(files))
              for f in files:
                  assert f.get("sha512") and f.get("size"), "incomplete feed entry: %r" % (f,)
          urls = [f["url"] for f in x["files"]] + [f["url"] for f in a["files"]]
          assert len(set(urls)) == 4, "feed file urls not unique: %r" % (urls,)
          merged = dict(x)  # version/path/sha512/releaseDate 以 x64 主条目为准
          merged["files"] = list(x["files"]) + list(a["files"])
          with open(sys.argv[3], "w") as out:
              yaml.safe_dump(merged, out, sort_keys=False, default_flow_style=False)
          print("merged update feed (x64 first):"); [print("  " + u) for u in urls]
          ' "$LATEST_X64" "$LATEST_ARM" "$LATESTYML"
            python3 -c 'import sys,yaml; d=yaml.safe_load(open(sys.argv[1])); assert len(d["files"])==4, "merged feed must carry 4 entries"; print("merged feed re-parse OK: 4 file entries")' "$LATESTYML"
          elif [ -n "$LATEST_X64" ]; then
            LATESTYML="$LATEST_X64"
          fi
          BLOCKMAPS="$(find candidate-x64 candidate-arm64 -name '*.blockmap' -print || true)"
          {
            echo "DEB=$DEB"
            echo "APPIMAGE=$APPIMAGE"
            echo "DEB_ARM=$DEB_ARM"
            echo "APPIMAGE_ARM=$APPIMAGE_ARM"
            echo "SUMS=$SUMS"
            echo "MANIFEST=$MANIFEST"
            echo "MANIFEST_ARM=$MANIFEST_ARM"
            echo "SUMMARY=$SUMMARY"
            echo "SUMMARY_ARM=$SUMMARY_ARM"
            echo "REPORT=$REPORT"
            echo "REPORT_ARM=$REPORT_ARM"
            echo "LATESTYML=${LATESTYML:-}"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$BLOCKMAPS" > "$RUNNER_TEMP/blockmaps.list"

      - name: Create GitHub Release with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.inputs.notes }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="$(node -p "JSON.parse(require('fs').readFileSync(process.env.MANIFEST,'utf8')).version")"
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          # Epoch ${TAG}

          Ubuntu desktop release of **Epoch** — the construction-engineering workbench.

          - Source commit: \`${GITHUB_SHA}\`
          - Release version: ${VERSION}
          - Tested: real installed-app journey (10 steps: launch → construction world → navigate → semantic select → inspect → isolate → unisolate → measure → annotate → relaunch), non-root, on BOTH architectures — x86_64 (Ubuntu-class Linux, Electron 41.0.3, ubuntu-24.04 CI) and arm64/aarch64 (ubuntu-24.04-arm CI)
          - Supported: Ubuntu 20.04 / 22.04 / 24.04 LTS x86_64; Ubuntu 24.04 LTS arm64 (see packages/desktop/scripts/linux-release/README.md)
          - Update channel: the baked Epoch GitHub feed (latest-linux.yml) carries BOTH architectures; AppImage auto-updates, .deb detects + downloads with user install

          ## Install

          \`\`\`bash
          # x86_64 (.deb recommended)
          sudo apt install ./Epoch-${VERSION}-linux-amd64.deb
          # x86_64 AppImage (no install)
          chmod +x Epoch-${VERSION}-linux-x86_64.AppImage
          ./Epoch-${VERSION}-linux-x86_64.AppImage

          # arm64 (.deb recommended)
          sudo apt install ./Epoch-${VERSION}-linux-arm64.deb
          # arm64 AppImage (no install)
          chmod +x Epoch-${VERSION}-linux-arm64.AppImage
          ./Epoch-${VERSION}-linux-arm64.AppImage
          # without FUSE (either arch):
          ./Epoch-${VERSION}-linux-<x86_64|arm64>.AppImage --appimage-extract-and-run
          \`\`\`

          ## Verify

          \`\`\`bash
          sha256sum --check SHA256SUMS
          \`\`\`

          ## Known limitations

          - arm64: Ubuntu 24.04 LTS is the tested matrix; older LTS arm64 installs are untested.
          - The construction-engineering demo opens with no credentials; agent/backend features may require provider configuration.
          - AppImage needs FUSE or the documented --appimage-extract-and-run fallback.
          EOF
          if [ -n "${NOTES:-}" ]; then
            printf '\n## Release notes\n\n%s\n' "$NOTES" >> "$RUNNER_TEMP/notes.md"
          fi
          # 幂等发布：release 已存在（例如 TL 已手工发布同 tag 的本地验收产物）时
          # 只补齐缺失资产，绝不覆盖——已发布并经 URL+sha256 复核的资产是不可变的，
          # CI 重建的二进制（时间戳不同）不允许替换已验证字节。
          # 更新 feed：合并后的双架构 latest-linux.yml + 双架构 blockmap（存在才挂载）。
          FEED_ASSETS=()
          [ -n "${LATESTYML:-}" ] && FEED_ASSETS+=("$LATESTYML")
          while IFS= read -r BM; do
            [ -n "$BM" ] && FEED_ASSETS+=("$BM")
          done < "$RUNNER_TEMP/blockmaps.list"
          if ! gh release create "$TAG" \
            --title "Epoch ${TAG}" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --verify-tag \
            "$DEB" "$APPIMAGE" "$DEB_ARM" "$APPIMAGE_ARM" "$SUMS" "$MANIFEST" "$MANIFEST_ARM" "$SUMMARY" "$SUMMARY_ARM" "$REPORT" "$REPORT_ARM" ${FEED_ASSETS[@]+"${FEED_ASSETS[@]}"}; then
            echo "release ${TAG} already exists — filling missing assets only (no replace)"
            for ASSET in "$DEB" "$APPIMAGE" "$DEB_ARM" "$APPIMAGE_ARM" "$SUMS" "$MANIFEST" "$MANIFEST_ARM" "$SUMMARY" "$SUMMARY_ARM" "$REPORT" "$REPORT_ARM" ${FEED_ASSETS[@]+"${FEED_ASSETS[@]}"}; do
              gh release upload "$TAG" "$ASSET" 2>/dev/null \
                || echo "asset $(basename "$ASSET") already present — kept as published"
            done
          fi

      - name: Verify every public asset URL + checksum after publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          TMPD="$(mktemp -d)"
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '.assets[] | [.name, .size, .browser_download_url] | @tsv' > "$TMPD/assets.tsv"
          COUNT="$(wc -l < "$TMPD/assets.tsv")"
          # 双架构下限：4 产物 + 合并 SUMS + 2 manifest + 2 summary + 2 report（feed 资产存在才计入）。
          [ "$COUNT" -ge 11 ] || { echo "FATAL: expected >=11 release assets (two-arch release), found $COUNT"; exit 1; }
          while IFS=$'\t' read -r NAME SIZE URL; do
            curl -fsSL -o "$TMPD/$NAME" "$URL"
            ACTUAL="$(stat -c%s "$TMPD/$NAME")"
            [ "$ACTUAL" = "$SIZE" ] || { echo "FATAL: size mismatch for $NAME ($ACTUAL vs $SIZE)"; exit 1; }
            echo "OK $NAME ($ACTUAL bytes from public URL)"
          done < "$TMPD/assets.tsv"
          for NAME in $(awk -F'\t' '{print $1}' "$TMPD/assets.tsv" | grep -E 'Epoch-.*\.(deb|AppImage)$'); do
            grep " $NAME\$" "$SUMS" | (cd "$TMPD" && sha256sum -c --strict -) \
              || { echo "FATAL: sha256 mismatch for $NAME against SHA256SUMS"; exit 1; }
          done
          echo "ALL PUBLIC ASSET URLS VERIFIED (size + sha256, both architectures)"
