version: 1

# 存量模块先标记为 legacy；新模块或完成迁移的模块设置 managed: true。
modules:
  - id: rpc
    roots: [packages/rpc/src]
    managed: false
  - id: shared
    roots: [packages/shared/src]
    managed: false
  - id: provider
    roots: [packages/provider/src]
    managed: false
  - id: provider-node
    roots: [packages/provider-node/src]
    managed: false
  - id: services
    roots: [packages/services/src]
    managed: false
  - id: session
    roots: [packages/services/src/session]
    managed: false
    requires: [shared]
    publicEntrypoints: [packages/services/src/session/contract.ts]
    owner: conversation
  - id: storage
    roots: [packages/services/src/storage]
    managed: true
    requires: [shared, rpc, services]
    publicEntrypoints: [packages/services/src/storage/contract.ts]
    layers: { domain: domain, app: app, adapters: adapters }
    layerOrder: [domain, app, adapters]
    owner: desktop-settings
  - id: client
    roots: [packages/client/src]
    managed: false
  - id: server
    roots: [packages/server/src]
    managed: false
  - id: zcode-server-cli
    roots: [packages/zcode-server-cli/src]
    managed: false
  - id: ui
    roots: [packages/ui/src]
    managed: false
  - id: web
    roots: [packages/web/src]
    managed: false
  - id: web-epoch
    roots: [packages/web/src/epoch]
    managed: true
    requires:
      [
        epoch-world-model,
        epoch-reconstruction-contract,
        epoch-world-presentation,
        epoch-renderer-contract,
        epoch-solution-contract,
        epoch-solution-surface,
        epoch-construction-fixture,
        epoch-renderer-babylon,
      ]
    publicEntrypoints: [packages/web/src/epoch/index.ts]
  - id: desktop
    roots: [packages/desktop/src]
    managed: false
  - id: formal-proof
    roots: [packages/formal-proof/src]
    managed: false
  - id: zcode-cli
    roots: [apps/zcode-cli]
    managed: false
  - id: epoch-world-model
    roots: [packages/epoch-world-model/src]
    managed: true
    publicEntrypoints: [packages/epoch-world-model/src/index.ts]
  - id: epoch-reconstruction-contract
    roots: [packages/epoch-reconstruction-contract/src]
    managed: true
    requires: [epoch-world-model]
    publicEntrypoints: [packages/epoch-reconstruction-contract/src/index.ts]
  - id: epoch-world-presentation
    roots: [packages/epoch-world-presentation/src]
    managed: true
    requires: [epoch-world-model]
    publicEntrypoints: [packages/epoch-world-presentation/src/index.ts]
  - id: epoch-renderer-contract
    roots: [packages/epoch-renderer-contract/src]
    managed: true
    requires: [epoch-world-presentation, epoch-world-model]
    publicEntrypoints: [packages/epoch-renderer-contract/src/index.ts]
  - id: epoch-solution-contract
    roots: [packages/epoch-solution-contract/src]
    managed: true
    requires: [epoch-world-model, epoch-reconstruction-contract, epoch-world-presentation]
    publicEntrypoints: [packages/epoch-solution-contract/src/index.ts]
  - id: epoch-solution-surface
    roots: [packages/epoch-solution-surface/src]
    managed: true
    requires: [epoch-solution-contract, epoch-reconstruction-contract]
    publicEntrypoints: [packages/epoch-solution-surface/src/index.ts]
  - id: epoch-renderer-babylon
    roots: [packages/epoch-renderer-babylon/src]
    managed: true
    requires: [epoch-renderer-contract, epoch-world-presentation]
    publicEntrypoints: [packages/epoch-renderer-babylon/src/index.ts]
  # W008 — Three.js interactive renderer adapter (second renderer behind the
  # frozen contract; proves renderer replaceability invariant #6 and portable
  # state invariant #12). 独立 managed 模块，消费冻结 epoch-* 包的公开入口
  # （不深引用），three 只在包 src 内导入；公开入口不含 Three 类型。
  - id: epoch-renderer-three
    roots: [packages/epoch-renderer-three/src]
    managed: true
    requires: [epoch-renderer-contract, epoch-world-presentation]
    publicEntrypoints: [packages/epoch-renderer-three/src/index.ts]
  - id: epoch-construction-fixture
    roots: [packages/epoch-construction-fixture/src]
    managed: true
    requires: [epoch-reconstruction-contract, epoch-world-model]
    publicEntrypoints: [packages/epoch-construction-fixture/src/index.ts]
  # W009 — IFC reconstruction engine adapter (first real external-format engine).
  # 独立 managed 模块，消费冻结 epoch-* 包的公开入口（不深引用），不引入
  # 任何渲染器/UI 运行时依赖。web-ifc（WASM IFC 解析器）作为 npm 依赖保留在
  # adapter 内部（不跨契约边界）。runtime=in-process（WASM 加载进 Node 进程）。
  # 依据 invariant #4/#7/#9/#10/#16/#18：引擎是能力，不写回世界状态，provider-
  # neutral core，安全边界前不可信。W011/W012 可在此 adapter 基础上扩展更多
  # external-format 引擎（OCCT/OpenUSD）。
  - id: epoch-reconstruction-ifc
    roots: [packages/epoch-reconstruction-ifc/src]
    managed: true
    requires: [epoch-reconstruction-contract, epoch-world-model]
    publicEntrypoints: [packages/epoch-reconstruction-ifc/src/index.ts]
  # W007 — Solution runtime composition (host-agnostic runtime binding a solution
  # session to engine + renderer + interaction mapping; portable view state per
  # invariant #12). 独立 managed 模块，消费冻结 epoch-* 包的公开入口（不深引用），
  # 不引入任何引擎/渲染器实现类型，不按 engineId 分支。
  - id: epoch-solution-runtime
    roots: [packages/epoch-solution-runtime/src]
    managed: true
    requires:
      [
        epoch-renderer-contract,
        epoch-world-presentation,
        epoch-solution-contract,
        epoch-world-model,
      ]
    publicEntrypoints: [packages/epoch-solution-runtime/src/index.ts]
  # W007 — World interaction layer (plan/section path + measurement/annotation
  # semantics; world-anchored, stable under renderer switch, stored as projection
  # state — never a second semantic authority, invariant #13/#14).
  - id: epoch-world-interaction
    roots: [packages/epoch-world-interaction/src]
    managed: true
    requires: [epoch-world-presentation, epoch-solution-contract, epoch-world-model]
    publicEntrypoints: [packages/epoch-world-interaction/src/index.ts]
  # W006 — Desktop Solution Host wiring (renderer-process composition of frozen
  # epoch capabilities). 独立 managed 模块，消费冻结 epoch-* 包的公开入口（不深引用），
  # 不引入任何引擎/渲染器实现类型，不按 engineId 分支。
  - id: desktop-solution-host
    roots: [packages/desktop/src/renderer/solution-host]
    managed: true
    requires:
      [
        epoch-solution-surface,
        epoch-renderer-babylon,
        epoch-construction-fixture,
        epoch-renderer-contract,
        epoch-reconstruction-contract,
        epoch-world-presentation,
        epoch-world-model,
      ]
    publicEntrypoints: [packages/desktop/src/renderer/solution-host/DesktopSolutionHost.tsx]
  # W006 — Desktop journey evidence runner (playwright-core _electron).
  - id: epoch-desktop-journey
    roots: [qa/epoch-desktop]
    managed: true
    publicEntrypoints: [qa/epoch-desktop/journey.mjs]
  # W010 — glTF delivery pipeline (deterministic WorldPresentation -> glTF/GLB
  # compiler; stable mapping law via extras.epoch; pure projection, no semantic
  # authority — ARCHITECTURE-LOCK #5/#10/#16/#17). Consumes frozen
  # epoch-world-presentation public entrypoint only.
  - id: epoch-gltf
    roots: [packages/epoch-gltf/src]
    managed: true
    requires: [epoch-world-presentation]
    publicEntrypoints: [packages/epoch-gltf/src/index.ts]
  # W027 — Task-conditioned reconstruction policy (profiles, fitness states,
  # VOI ordering, evidence-aware sufficiency). Provider-neutral; consumes the
  # frozen epoch-world-model public entrypoint only (invariant 16).
  - id: epoch-reconstruction-policy
    roots: [packages/epoch-reconstruction-policy/src]
    managed: true
    requires: [epoch-world-model]
    publicEntrypoints: [packages/epoch-reconstruction-policy/src/index.ts]
  # W028 — Application Environment Fabric: provider-neutral environment
  # contracts (descriptors, registry, sessions, capability planes, privacy
  # policy). Zero runtime deps; environment-contract layer only.
  - id: epoch-application-environment
    roots: [packages/epoch-application-environment/src]
    managed: true
    requires: []
    publicEntrypoints: [packages/epoch-application-environment/src/index.ts]
  # W028 — Environment Surface: lifecycle controller over the application
  # environment contracts (attach/detach/health, deny-by-default control,
  # provider-neutral via dependency injection).
  - id: epoch-environment-surface
    roots: [packages/epoch-environment-surface/src]
    managed: true
    requires: [epoch-application-environment]
    publicEntrypoints: [packages/epoch-environment-surface/src/index.ts]
  # W021 — Durable persistence: content-addressed world/solution revision store
  # (file + memory adapters), surface identity continuity registry, and the
  # non-authoritative cache law. Provider-neutral port; consumes the frozen
  # epoch contracts' public entrypoints only; never a second semantic authority
  # (invariants 4/14/17).
  - id: epoch-persistence
    roots: [packages/epoch-persistence/src]
    managed: true
    requires: [epoch-world-model, epoch-solution-contract]
    publicEntrypoints: [packages/epoch-persistence/src/index.ts]
  # W011 — OCCT geometry capability: provider-neutral B-Rep kernel port,
  # analytic adapter with honest capability levels, derive-only world bridge.
  - id: epoch-geometry-occt
    roots: [packages/epoch-geometry-occt/src]
    managed: true
    requires: [epoch-world-model, epoch-reconstruction-contract]
    publicEntrypoints: [packages/epoch-geometry-occt/src/index.ts]
  # W022 — Universal engineering lifecycle: ten-phase evidence-keyed
  # deterministic state machine organizing work around the world-model
  # authority without becoming a second semantic authority.
  - id: epoch-lifecycle
    roots: [packages/epoch-lifecycle/src]
    managed: true
    requires: [epoch-world-model, epoch-solution-contract, epoch-persistence]
    publicEntrypoints: [packages/epoch-lifecycle/src/index.ts]
  # W023 — Capability discovery: evidence-derived capability/role discovery on
  # the W021/W022 authority spine; declarations are frozen data, discovery
  # never grants execution authority.
  - id: epoch-capability-discovery
    roots: [packages/epoch-capability-discovery/src]
    managed: true
    requires: [epoch-world-model, epoch-persistence, epoch-lifecycle]
    publicEntrypoints: [packages/epoch-capability-discovery/src/index.ts]
  # W012 — OpenUSD composition: usda subset parser (strict USD grammar:
  # arcs are prim metadata, never body statements), layer/variant/reference
  # opinion resolution, derive-only world bridge.
  - id: epoch-scene-usd
    roots: [packages/epoch-scene-usd/src]
    managed: true
    requires: [epoch-reconstruction-contract, epoch-world-model]
    publicEntrypoints: [packages/epoch-scene-usd/src/index.ts]
  # W018 — Timeline and construction state: phase/position/visibility/
  # animate projections over world revisions, digest-bound cursor; a pure
  # projection authority — never a second semantic authority.
  - id: epoch-timeline
    roots: [packages/epoch-timeline/src]
    managed: true
    requires: [epoch-world-model, epoch-construction-fixture]
    publicEntrypoints: [packages/epoch-timeline/src/index.ts]
  # W029 — Environment activity and demonstrations: typed event core with
  # consent/privacy laws, episodes/demonstrations, coverage honesty,
  # candidate exports (unverified only), digest-keyed persistence binding.
  - id: epoch-environment-activity
    roots: [packages/epoch-environment-activity/src]
    managed: true
    requires: [epoch-world-model, epoch-application-environment, epoch-persistence]
    publicEntrypoints: [packages/epoch-environment-activity/src/index.ts]
  # W024 — Agent tools: typed command contracts with default-deny
  # authorization, digest-keyed append-only audit, no-renderer boundary;
  # agents act through the solution surface, never around it.
  - id: epoch-agent-tools
    roots: [packages/epoch-agent-tools/src]
    managed: true
    requires: [epoch-solution-surface, epoch-world-model, epoch-world-interaction, epoch-persistence]
    publicEntrypoints: [packages/epoch-agent-tools/src/index.ts]
  # W025 — Human expert escalation: policy-gated escalation machine with
  # typed protocol, provenance-bearing responses, rate limits, digest-keyed
  # persistence; experts answer through the surface, never around it.
  - id: epoch-human-escalation
    roots: [packages/epoch-human-escalation/src]
    managed: true
    requires: [epoch-world-model, epoch-persistence, epoch-lifecycle]
    publicEntrypoints: [packages/epoch-human-escalation/src/index.ts]
  # W030 — Capability quality lab: qualification vocabulary, versioned
  # benchmark descriptors with corpus rights laws, per-class metric
  # selection, differential conformance harness, regression checks,
  # capability release gate; evaluation is read-only over declarations.
  - id: epoch-capability-evaluation
    roots: [packages/epoch-capability-evaluation/src]
    managed: true
    requires: [epoch-world-model, epoch-capability-discovery]
    publicEntrypoints: [packages/epoch-capability-evaluation/src/index.ts]
  # W032 — Capability-gap learning: gap records with classifier routing,
  # candidate extraction under held-out replay law, reuse permission
  # enforcement, human-approval promotion with rollback, regression watch
  # with intervention-cost measurement.
  - id: epoch-capability-learning
    roots: [packages/epoch-capability-learning/src]
    managed: true
    requires: [epoch-environment-activity, epoch-capability-evaluation, epoch-capability-discovery]
    publicEntrypoints: [packages/epoch-capability-learning/src/index.ts]
  # W031 — Capability reproduction factory: governed pipeline turning
  # missing capabilities into Epoch mini-apps under rights/quality/security
  # gates; release impossible when any gate fails; opens through the
  # generic workbench surface.
  - id: epoch-capability-reproduction
    roots: [packages/epoch-capability-reproduction/src]
    managed: true
    requires: [epoch-application-environment, epoch-environment-activity, epoch-capability-evaluation]
    publicEntrypoints: [packages/epoch-capability-reproduction/src/index.ts]
  # W033 — Cost/quality frontier and alternative search: baseline and
  # candidates with separate revision identity, hard constraints vs
  # weighted preferences, lifecycle costs with uncertainty, data-composed
  # alternatives, Pareto frontier with typed rejections.
  - id: epoch-cost-quality-search
    roots: [packages/epoch-cost-quality-search/src]
    managed: true
    requires: [epoch-reconstruction-policy, epoch-capability-evaluation]
    publicEntrypoints: [packages/epoch-cost-quality-search/src/index.ts]
  # W034 — Arena expert loop and learnback: expert task packages with
  # minimized/redacted evidence exports, typed return packages, verification
  # + world-revision proposals, independent reuse-rights decisions,
  # simulated full-round-trip endpoint.
  - id: epoch-arena-adapter
    roots: [packages/epoch-arena-adapter/src]
    managed: true
    requires: [epoch-human-escalation, epoch-environment-activity, epoch-capability-learning]
    publicEntrypoints: [packages/epoch-arena-adapter/src/index.ts]
  # W035 — Engineering automation and abundance evaluation: typed task-family
  # denominators, completion and verified-quality metrics, baselines and
  # intervention measures with a quality-gate law, escalation and capability-
  # reuse rates, safety regressions, predicted-vs-actual variance with a
  # feasibility gate, provenance-chained end-to-end cases. Read-only
  # measurement over lifecycle/evidence records; no execution authority.
  - id: epoch-engineering-objective
    roots: [packages/epoch-engineering-objective/src]
    managed: true
    requires: []
    publicEntrypoints: [packages/epoch-engineering-objective/src/index.ts]
  # W013 — Blender/CAD capability: isolated native-process adapters (Blender
  # bpy-headless, FreeCAD console) as typed data — versioned tool descriptors,
  # invocation contracts (argv/stdin/exit codes as data), GPL/LGPL license and
  # provenance records, geometry exchange schemas with fidelity gates,
  # deterministic validation machines. No execution authority; process
  # contracts stay out of shared UI.
  - id: epoch-foundation-blender
    roots: [packages/epoch-foundation-blender/src]
    managed: true
    requires: []
    publicEntrypoints: [packages/epoch-foundation-blender/src/index.ts]
  # W014 — Cesium site context: optional geospatial site context as a world
  # PROJECTION — typed site models (EPSG/WGS84 anchor/extents, terrain and
  # imagery refs by digest, site-only entities), deterministic
  # local-to-ENU-to-ECEF placement law for world-model entities referenced
  # by digest, recomputed read-model projection records, validation
  # machines. No Cesium runtime, no network, no second semantic authority.
  - id: epoch-site-cesium
    roots: [packages/epoch-site-cesium/src]
    managed: true
    requires: []
    publicEntrypoints: [packages/epoch-site-cesium/src/index.ts]
  # W015 — ParaView result projection: scientific/engineering result
  # visualization as PROJECTION read-models — typed scalar/vector/tensor
  # fields over mesh/topology referenced by digest, provider-neutral
  # ParaView state descriptors (color maps, slices, clips, glyphs,
  # streamlines as data), result projection records with declared
  # derivations, deterministic validation machines and coverage summaries.
  # No ParaView runtime, no VTK parsing; results never replace baseline
  # world state.
  - id: epoch-results-paraview
    roots: [packages/epoch-results-paraview/src]
    managed: true
    requires: []
    publicEntrypoints: [packages/epoch-results-paraview/src/index.ts]
  # W010 qa conformance harness lives at qa/epoch-gltf (node --test), unmanaged like sibling qa dirs.
  # W020 — Verification and evidence battery (both-host journey harness,
  # renderer equivalence, environment matrix, evidence convention).
  - id: epoch-world
    roots: [qa/epoch-world]
    managed: true
    requires: [epoch-renderer-babylon, epoch-renderer-three, epoch-world-presentation, epoch-renderer-contract]
    publicEntrypoints: [qa/epoch-world/run-battery.mjs]

global:
  maxFileLines: 400
  maxContractLines: 300
  maxPublicMethods: 12
  forbidCycles: true
  forbidDeepImports: true
  managedOnly: true

exceptions: []
